<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kite CRM — Loading</title>
<style>
  :root{
    --sky:#5cb8e6;
    --blue:#2d5fad;
    --red:#c6193e;
    --track:#e7eef7;
    --bg:#ffffff;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }

  /* ---- Full-screen loader overlay ---- */
  .kite-loader{
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:34px;
    background:var(--bg);
    z-index:9999;
    transition:opacity .5s ease, visibility .5s ease;
  }
  .kite-loader.is-hidden{opacity:0;visibility:hidden;}

  .kite-logo{
    width:min(360px,68vw);
    height:auto;
    display:block;
    overflow:visible;
  }

  /* pieces start hidden; revealed only while .play is on */
  .piece{opacity:0;}
  .wordmark{opacity:0;}
  .tagline{opacity:0;}

  /* ---- assembly, gated on .play so it can be restarted ---- */
  .play .light{
    animation:pieceL .58s cubic-bezier(.22,1,.36,1) .10s forwards;
  }
  .play .dark{
    animation:pieceR .62s cubic-bezier(.22,1,.36,1) .28s forwards;
  }
  .play .red{
    animation:pieceB .58s cubic-bezier(.22,1,.36,1) .50s forwards;
  }
  .play .wordmark{
    opacity:1;
    animation:reveal .68s cubic-bezier(.22,1,.36,1) .96s both;
  }
  .play .tagline{
    animation:rise .52s ease-out 1.52s forwards;
  }

  @keyframes pieceL{
    0%{opacity:0;transform:translateX(-32px);}
    100%{opacity:1;transform:translateX(0);}
  }
  @keyframes pieceR{
    0%{opacity:0;transform:translate(38px,10px);}
    100%{opacity:1;transform:translate(0,0);}
  }
  @keyframes pieceB{
    0%{opacity:0;transform:translate(-16px,16px);}
    100%{opacity:1;transform:translate(0,0);}
  }
  /* left-to-right wipe via clip rect width */
  @keyframes reveal{
    0%{clip-path:inset(0 100% 0 0);}
    100%{clip-path:inset(0 0 0 0);}
  }
  @keyframes rise{
    0%{opacity:0;transform:translateY(8px);}
    100%{opacity:1;transform:translateY(0);}
  }

  /* ---- loading bar ---- */
  .progress{
    width:190px;
    height:4px;
    border-radius:99px;
    background:var(--track);
    overflow:hidden;
    opacity:0;
  }
  .play .progress{animation:fadeIn .5s ease 1.75s forwards;}
  .progress::after{
    content:"";
    display:block;
    height:100%;
    width:42%;
    border-radius:99px;
    background:linear-gradient(90deg,var(--blue),var(--sky));
    animation:shuttle 1.25s ease-in-out infinite;
  }
  @keyframes shuttle{
    0%{transform:translateX(-115%);}
    100%{transform:translateX(255%);}
  }
  @keyframes fadeIn{to{opacity:1;}}

  /* preview-only replay control (safe to delete for production) */
  .replay{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    border:0;background:none;cursor:pointer;
    font:500 12px/1 inherit;letter-spacing:.04em;
    color:#9aa7b8;padding:8px 10px;border-radius:8px;
    transition:color .2s ease;
  }
  .replay:hover{color:var(--blue);}
  .replay:focus-visible{outline:2px solid var(--blue);outline-offset:2px;}

  /* ---- reduced motion: show finished logo, only bar moves ---- */
  @media (prefers-reduced-motion: reduce){
    .piece,.wordmark,.tagline{opacity:1 !important;transform:none !important;animation:none !important;}
    .wordmark{clip-path:none !important;}
    .progress{opacity:1 !important;animation:none !important;}
  }
</style>
</head>

<script>
  /* Public API for your app:
     KiteLoader.hide()  -> fade the splash out when your app is ready
     KiteLoader.show()  -> bring it back / restart the assembly            */
  const el = document.getElementById('kiteLoader');
  window.KiteLoader = {
    hide(){ el.classList.add('is-hidden'); },
    show(){
      el.classList.remove('is-hidden');
      el.classList.remove('play'); void el.offsetWidth; el.classList.add('play');
    }
  };

  // preview-only replay
  document.getElementById('replayBtn').addEventListener('click', () => {
    el.classList.remove('is-hidden');
    el.classList.remove('play'); void el.offsetWidth; el.classList.add('play');
  });

  /* DEMO ONLY: replay the assembly on a gentle loop so you can watch it.
     Delete this block in production — the bar keeps looping on its own
     until you call KiteLoader.hide().                                     */
  setInterval(() => {
    if (el.classList.contains('is-hidden')) return;
    el.classList.remove('play'); void el.offsetWidth; el.classList.add('play');
  }, 4800);
</script>
